<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" />
            <circle cx="12" cy="12" r="4" />
            <line x1="21.17" y1="8" x2="12" y2="8" />
            <line x1="3.95" y1="6.06" x2="8.54" y2="14" />
            <line x1="10.88" y1="21.94" x2="15.46" y2="14" />
          </svg>
        </div>
        <h1>FocusAI</h1>
      </div>
      <label class="switch" title="Toggle page analysis filtering">
        <input type="checkbox" id="enabled" />
        <span class="slider"></span>
        <span class="switch-text">Filtering</span>
      </label>
    </header>

    <main class="content">
      <section id="tab-state" class="card card-centerpiece" hidden>
        <div id="tab-decision"></div>
        <p id="tab-explanation"></p>
        <div id="tab-concepts" class="chips"></div>
      </section>

      <section class="card">
        <div class="card-header">
          <h2>Active Study Session</h2>
        </div>
        <div class="select-wrapper">
          <select id="session" aria-label="Select active study session"></select>
          <svg class="select-arrow" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
          </svg>
        </div>
        <p class="hint" id="session-hint">Tip: Starting a session in the web app syncs here automatically.</p>
      </section>

      <details class="card settings-card">
        <summary class="settings-summary">
          <span>Backend Connection</span>
          <svg class="settings-chevron" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" />
          </svg>
        </summary>
        <div class="settings-body">
          <label for="backend" class="field-label">API Endpoint</label>
          <input id="backend" type="url" placeholder="http://127.0.0.1:8000" />
          <div class="row">
            <button id="save" class="primary">Save</button>
            <button id="test" class="ghost">Test Connection</button>
          </div>
          <p id="status" class="hint"></p>
        </div>
      </details>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
