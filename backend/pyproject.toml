[project]
name = "backend"
version = "0.2.0"
description = "FocusAI backend: context-aware relevance engine, content extraction and analytics API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "beautifulsoup4>=4.15.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.0",
    "lxml>=6.1.3",
    "numpy>=2.0.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pyjwt>=2.13.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.20",
    "requests>=2.32.0",
    "sqlalchemy>=2.0.52",
    "supabase>=2.31.0",
    "torch>=2.14.1",
    "uvicorn>=0.52.4",
    "youtube-transcript-api>=1.2.4",
]

[project.optional-dependencies]
# Real semantic embeddings (pulls in PyTorch, ~2 GB). Without it FocusAI falls back to a
# built-in lexical embedder that works offline but is weaker on paraphrase/synonyms.
ml = ["sentence-transformers>=3.0.0"]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
